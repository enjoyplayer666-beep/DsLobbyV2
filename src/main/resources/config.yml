# =====================================================================
#  DestroyLobby - config.yml
#  Все тексты - MiniMessage: <gradient:#A:#B>..</gradient>, <#RRGGBB>, <bold>, <white> ...
#  Цвета сняты пипеткой со скринов сервера-образца.
#  Иконки (⛃, \uE030 и т.д.) берутся из ресурс-пака SP-DS - без пака будут квадратиками.
# =====================================================================

# не трогать: по этому номеру плагин понимает, что конфиг уже нового формата
config-version: 2

worlds:
  # имя мира лобби на сервере (как в /mv list)
  lobby: "world"
  # что писать вместо имени мира лобби в табе
  lobby-display-name: "lobby"
  # игровые миры: имя_мира_на_сервере: "Отображаемое имя"
  game-worlds:
    SkyPvP: "SkyPvP"

# ---------------------------------------------------------------------
#  Разделение лобби и игровых миров
# ---------------------------------------------------------------------
isolation:
  enabled: true
  # lobby-vs-game - лобби отдельно, все игровые миры вместе (SkyPvP + его незер/энд)
  # per-world     - каждый мир отдельно
  mode: "lobby-vs-game"
  # не показывать чат другого мира (SkyPvP не видит лобби и наоборот)
  chat: true
  # право видеть в табе всех игроков со всех миров
  see-all-permission: "destroylobby.seeall"
  # право видеть чат со всех миров
  chat-see-all-permission: "destroylobby.chat.seeall"

# ---------------------------------------------------------------------
#  TAB
# ---------------------------------------------------------------------
tab:
  update-interval-ticks: 20

  lobby:
    # каждая строка списка = строка в табе, "" = пустая строка
    header:
      - "<gradient:#FB786F:#FDCB6B>DestroyCraft</gradient>"
      - "<#FDBD6C>{world}</#FDBD6C>"
      - ""
    footer:
      - ""
      - "<gradient:#FB786F:#FDCB6B>Группа ВК</gradient> <white>•</white> <white>vk.com/game_ds</white>"
      - "<gradient:#FB786F:#FDCB6B>Дискорд</gradient> <white>•</white> <white>discord.gg/H6aHmpt</white>"
      - "<gradient:#FB786F:#FDCB6B>ТГ канал</gradient> <white>•</white> <white>t.me/dscraft</white>"
      - ""
      - "<#FDBD6C>ds-craft.ru</#FDBD6C>"
    # один и тот же префикс у ВСЕХ в лобби. \uE030 - оранжевый смайлик из ресурс-пака.
    # Если не хочешь обновлять пак - поставь "<#FC8F6E>☺</#FC8F6E> "
    shared-prefix: "<#FC8F6E>\uE030</#FC8F6E> "
    shared-name-color: "&7"

  game:
    header:
      - "<bold><gradient:#6D84FC:#FFFFFF>DestroyCraft</gradient></bold>"
      - "<white>{world}</white>"
      - ""
    footer:
      - ""
      - "<gradient:#6D84FC:#FFFFFF>Наши соц.сети:</gradient>"
      - "<gradient:#6D84FC:#FFFFFF>Используйте</gradient> <white>• /links</white>"
      - ""
      - "<#6D84FC>ds-craft.ru</#6D84FC>"
    # показывать префиксы/суффиксы из LuckPerms
    show-prefixes: true
    # префикс, если у игрока в LuckPerms префикса нет (обычный игрок) - серые мечи, как на скрине
    default-prefix: "&7⚔ "
    # сам ставит пробел между ником и суффиксом ("Akemitori ✔")
    suffix-auto-space: true

# ---------------------------------------------------------------------
#  Скорборд справа (только в игровых мирах)
# ---------------------------------------------------------------------
scoreboard:
  show-in-lobby: false
  update-interval-ticks: 20
  # убрать красные цифры справа
  hide-numbers: true
  # hearts - ХП в сердечках (10 при полном здоровье), points - в единицах (20)
  health-mode: "hearts"
  date-format: "dd.MM.yyyy"
  game:
    title: "<gradient:#6D84FC:#FFFFFF>{world}</gradient>"
    # {player} {health} {coins} {kills} {deaths} {date}
    # пробелы в начале строки - чтобы дата и сайт стояли по центру, как на скрине
    lines:
      - "    <#A1B0C7>{date}</#A1B0C7>"
      - ""
      - "<yellow>⚡</yellow> <#A7B4FC>Ник:</#A7B4FC> <white>{player}</white>"
      - "<dark_red>❤</dark_red> <#A7B4FC>ХП:</#A7B4FC> <white>{health}</white>"
      - "<white>⛃</white>  <#A7B4FC>Коины:</#A7B4FC> <white>{coins}</white>"
      - ""
      - "<red>⚔</red> <#A7B4FC>Убийства:</#A7B4FC> <white>{kills}</white>"
      - "<white>☠</white> <#A7B4FC>Смерти:</#A7B4FC> <white>{deaths}</white>"
      - ""
      - "  <gradient:#6D84FC:#FFFFFF>ds-craft.ru</gradient>"

# ---------------------------------------------------------------------
#  Приветствие при входе через портал из лобби в игровой мир (SkyPvP).
#  Чат сначала очищается (clear-lines пустых строк), потом выводятся lines.
#  Строки - MiniMessage, <center> в начале - по центру чата. Цвета сняты со скрина.
# ---------------------------------------------------------------------
game-welcome:
  enabled: true
  clear-chat: true
  clear-lines: 100
  lines:
    - ""
    - "<center><#7B8FFB>SkyPvP"
    - "<center><gray>Добро пожаловать на сервер!"
    - "<center><gray>Группа Вконтакте: <click:open_url:https://vk.com/game_ds><#7B8FFB>vk.com/game_ds</click>"
    - "<center><gray>Онлайн магазин: <click:open_url:https://ds-craft.ru><#7B8FFB>ds-craft.ru</click>"
    - "<center><gray>Меню сервера: <click:run_command:/menu><#7B8FFB>/menu</click>"
    - "<center><gray>Правила: <click:run_command:/rules><#7B8FFB>/rules</click>"
    - ""
    - ""
    - "<#E0E4FF>→</#E0E4FF> <#4682E4>Меню скайпвп</#4682E4>"
    - "<#4682E4>→</#4682E4> <#E0E4FF>Пропишите - <click:run_command:/menu><#4682E4>/menu</#4682E4></click></#E0E4FF>"

# ---------------------------------------------------------------------
#  Прыжок в лобби (одиночный, сила зависит от взгляда)
# ---------------------------------------------------------------------
lobby-jump:
  enabled: true
  # Shift + пробел = обычный ванильный прыжок (для паркура)
  sneak-for-normal-jump: true
  # право на прыжок, "" = доступно всем
  permission: ""
  # пауза между прыжками в тиках (20 = 1 секунда); во время паузы - обычный ванильный прыжок
  cooldown-ticks: 20
  # сила вверх: min - взгляд вниз, max - взгляд вверх (прямо = середина)
  # 0.55 ≈ 2 блока, 0.9 ≈ 5 блоков, 1.3 ≈ 9.5 блока
  vertical:
    min: 0.55
    max: 1.30
  # сила вперёд (так же от взгляда)
  forward:
    min: 0.35
    max: 0.85
  no-fall-damage: true
  # у кого есть это право - не снимаем /fly в лобби
  keep-flight-permission: "essentials.fly"
  sound:
    name: "ENTITY_BLAZE_SHOOT"
    volume: 0.5
    pitch: 1.6
  particles:
    main: "SOUL_FIRE_FLAME"   # синий огонь
    secondary: "SOUL"         # синие души, "none" - выключить
    burst-count: 20           # облако огня в момент прыжка
    ring-points: 12           # кольцо огня, разлетающееся от ног
    trail-count: 3            # частиц следа за тик полёта
    trail-max-ticks: 100
    landing-count: 10         # "хлопок" при приземлении
  # не трогать: по нему плагин один раз обновляет паузу и количество огня в старом конфиге
  settings-version: 2

# ---------------------------------------------------------------------
# ---------------------------------------------------------------------
#  Чат: здесь только правила лобби. Формат чата, /color и /prefix chat -
#  в плагине DestroyChat (plugins/DestroyChat/config.yml).
# ---------------------------------------------------------------------
chat:
  block-in-lobby: true
  lobby-blocked-message: "<yellow>❗</yellow> <gray>Вы находитесь в <gold>лобби</gold>, здесь чат недоступен</gray>"

lobby-protection:
  enabled: true
  force-spawn-on-join: true
  # false - при заходе в лобби переносит и тех, у кого право обхода защиты лобби (команда проекта);
  # true - они остаются там, где вышли. Операторов не трогает ops-bypass (ниже).
  join-bypass: false
  respawn-in-lobby: true
  ops-bypass: true
  spawn:
    world: ""
  block-build: true
  block-break: true
  block-drop-items: true
  block-pickup-items: true
  block-inventory-interact: true
  block-damage: true
  block-hunger: true
  allowed-commands:
    - "prefix"
    - "color"
    - "links"
    - "menu"
    - "rules"
    - "link"
    - "login"
    - "l"
    - "register"
    - "reg"
  blocked-action-message: "<yellow>❗</yellow> <gray>В лобби это действие недоступно</gray>"
  blocked-command-message: "<yellow>❗</yellow> <gray>Эта команда недоступна в лобби</gray>"

luckperms:
  # цвет НИКА по primary-группе (ключ = имя группы из /lp listgroups). Hex работает в табе;
  # над головой Minecraft умеет только 16 цветов - там берётся ближайший.
  nick-colors:
    default: "&#CDCDFF"
    vip: "&7"
    luxe: "&7"
    deluxe: "&7"
    ultra: "&7"
    legend: "&7"
    elitesp: "&7"
    admin: "&f"
    manager: "&f"
    curator: "&f"
    moderator: "&f"
    media: "&f"

customprefix:
  # /prefix set (Deluxe+)
  permission: "destroylobby.customprefix"
  max-length: 24
  priority: 999

storage:
  file: "playerdata.yml"
