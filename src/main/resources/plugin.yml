name: DestroyLobby
version: ${project.version}
main: ru.dscraft.destroylobby.DestroyLobbyPlugin
api-version: '1.21'
author: DestroyCraft
softdepend:
- LuckPerms
- PlaceholderAPI
- Multiverse-Core
- AdvancedPortals
- MediaEconomy
- DestroySkyPvP
- DestroyPvP
loadbefore:
- DestroyChat
commands:
  destroylobby:
    description: Перезагрузка конфига и точка спавна лобби
    usage: /destroylobby reload|setspawn
    permission: destroylobby.admin
  coins:
    description: Управление коинами игрока
    usage: /coins <give|take|set> <ник> <сумма>
    permission: destroylobby.admin
  hub:
    description: Телепорт в лобби
    usage: /hub
    aliases:
    - lobby
  spawn:
    description: Телепорт на спавн SkyPvP (в лобби - на точку лобби)
    usage: /spawn
  prefix:
    description: Личный префикс и префикс для чата
    usage: /prefix set <текст> | /prefix reset [ник] | /prefix chat <текст|reset>
  mediatab:
    description: Перезагрузка конфига MediaTab
    usage: /mediatab reload
    permission: mediatab.admin
  glow:
    description: Меню свечения
    usage: /glow
  destroymotd:
    description: Перезагрузить конфигурацию MOTD
    usage: /destroymotd reload
    permission: destroycraft.motd.reload
permissions:
  destroylobby.admin:
    default: op
  destroylobby.customprefix:
    default: false
  destroylobby.lobby.bypass:
    default: false
  destroylobby.chat.bypass:
    default: op
  destroylobby.seeall:
    default: false
  destroylobby.chat.seeall:
    default: false
  destroylobby.prefix.reset.others:
    description: /prefix reset ник - сбросить префикс другому игроку (команда проекта)
    default: op
  destroylobby.prefix.format:
    default: false
  mediatab.admin:
    default: op
  destroycraft.motd.reload:
    default: op
description: Лобби DestroyCraft + модули MediaTab (таб, скорборд, /glow) и DestroyCraftMOTD (MOTD)
